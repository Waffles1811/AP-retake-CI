version: 2.1

jobs:
  build:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: sudo apt-get update && sudo apt-get install -y build-essential cmake
      - run:
          name: Build project
          command: |
            mkdir -p build
            cd build
            cmake ..
            make
